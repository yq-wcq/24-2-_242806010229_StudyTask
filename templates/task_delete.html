{% extends "base.html" %}
{% block title %}确认删除 · StudyTask{% endblock %}

{% block content %}
<section class="page-head">
  <div>
    <h1>确认删除任务</h1>
    <p class="muted">删除后任务将从数据库中移除，且无法恢复。</p>
  </div>
</section>

<section class="panel danger-panel">
  <div class="danger-icon">!</div>
  <h2>{{ task.title }}</h2>
  <dl class="detail-grid compact">
    <div><dt>所属课程</dt><dd>{{ task.course }}</dd></div>
    <div><dt>截止日期</dt><dd>{{ task.due_date }}</dd></div>
    <div><dt>优先级</dt><dd>{{ task.priority }}</dd></div>
    <div><dt>状态</dt><dd>{{ task.status }}</dd></div>
  </dl>
  <div class="form-actions">
    <form method="post" action="{{ url_for('remove_task', task_id=task.id) }}">
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-danger" type="submit">确认删除</button>
    </form>
    <a class="btn btn-ghost" href="{{ url_for('task_detail', task_id=task.id) }}">取消，返回详情</a>
  </div>
</section>
{% endblock %}
