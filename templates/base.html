<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}StudyTask{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">ST</span>
        <span>
          <strong>StudyTask</strong>
          <small>个人学习任务管理</small>
        </span>
      </a>
      <nav class="nav">
        <a href="{{ url_for('index') }}">任务列表</a>
        <a class="btn btn-primary btn-sm" href="{{ url_for('new_task') }}">+ 新建任务</a>
      </nav>
    </div>
  </header>

  <main class="wrap main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-area">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">StudyTask · 软件工程实验一 · Flask + SQLite</div>
  </footer>
</body>
</html>
